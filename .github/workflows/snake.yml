name: Generate Snake Animation

on:
  schedule:
    # Runs every hour from 4:00 AM to 12:00 PM UTC, Monday through Friday
    # (Matches 9:30 AM to 5:30 PM IST, Mon–Fri)
    - cron: "0 4-12 * * 1-5"
  
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prevent workflow suspension due to inactivity
        uses: gautamkrishnar/keepalive-workflow@v2
